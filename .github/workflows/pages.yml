name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site needs no build: it is served exactly as it sits in the repo,
      # ES modules and import map included. What it does need is for the parts
      # that are not the site to stay out of it — `blend/` alone is 4.3MB of
      # Blender originals that exist to regenerate `assets/`, and nothing a
      # visitor loads has ever pointed at them.
      - name: Leave the build inputs behind
        run: rm -rf blend tests tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
