name: Deploy to Pages

on:
  push:
    # The feature branch is here so the site can be previewed before it merges.
    # `workflow_dispatch` cannot stand in for it: GitHub only offers the manual
    # run for workflows that already exist on the default branch, and this one
    # does not yet. Drop the second entry once it has merged.
    branches: [main, chess-game-enhancement]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site needs no build: it is served exactly as it sits in the repo,
      # ES modules and import map included.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
