<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="A 3D chess game built on three.js — play the computer or a friend, with clocks, analysis and six board themes."
    />
    <title>Boxwood · chess in three dimensions</title>

    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="src/ui/tokens.css" />
    <link rel="stylesheet" href="src/ui/app.css" />
    <link rel="stylesheet" href="src/ui/components.css" />

    <!--
      Native ES modules with an importmap: the source runs unbundled, straight
      from a static server, with no build step between editing a file and seeing
      the change.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/",
          "chess.js": "./vendor/chess.js/chess.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This chess game needs JavaScript.
      </p>
    </noscript>

    <script type="module">
      import { bootstrap } from './src/app/main.js';

      const root = document.getElementById('root');
      try {
        window.__app = await bootstrap(root);
        window.__appReady = true;
      } catch (error) {
        window.__appError = String(error?.stack ?? error);
        root.innerHTML = '';
        const panel = document.createElement('div');
        panel.style.cssText =
          'display:grid;place-items:center;height:100dvh;padding:2rem;text-align:center;gap:.5rem';
        panel.innerHTML =
          '<h1 style="font-size:1.125rem;margin:0">The game failed to start</h1>' +
          '<p style="color:var(--text-2);max-width:38rem;margin:0"></p>';
        panel.querySelector('p').textContent = String(error?.message ?? error);
        root.append(panel);
        throw error;
      }
    </script>
  </body>
</html>
