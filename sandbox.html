<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>chessboard3 · renderer sandbox</title>
    <link rel="icon" href="img/favicon.ico" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/",
          "chess.js": "./vendor/chess.js/chess.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0d1014;
        color: #e6e9ef;
        display: grid;
        grid-template-columns: 1fr 260px;
        height: 100dvh;
      }
      #board {
        min-width: 0;
      }
      #panel {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: auto;
        border-left: 1px solid #232833;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7d8797;
        margin: 0 0 4px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: #a6b0c0;
      }
      select,
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 9px;
        border-radius: 7px;
        border: 1px solid #2c3341;
        background: #171c24;
        color: #e6e9ef;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #1f2632;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #7d8797;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <div id="panel">
      <h1>Renderer sandbox</h1>
      <label
        >Theme
        <select id="theme"></select
      ></label>
      <label
        >Piece set
        <select id="pieceSet"></select
      ></label>
      <label
        >Camera
        <select id="camera"></select
      ></label>
      <button id="flip">Flip</button>
      <button id="play">Play a line</button>
      <button id="arrow">Toggle arrows</button>
      <div id="log">booting…</div>
    </div>
    <script type="module">
      import { Board3D, CAMERA_MODES } from './src/render/three/board3d.js';
      import { THEMES } from './src/render/three/themes.js';
      import { PIECE_SETS } from './src/render/three/pieces.js';
      import { GameState } from './src/core/gameState.js';

      const log = (message) => {
        document.getElementById('log').textContent = message;
        window.__sandboxLog = message;
      };

      const fill = (id, entries) => {
        const select = document.getElementById(id);
        select.innerHTML = entries
          .map(([value, label]) => `<option value="${value}">${label}</option>`)
          .join('');
        return select;
      };

      const game = new GameState();
      let board;
      try {
        board = new Board3D('board', { theme: 'tournament', pieceSet: 'classic' });
        window.__board = board;
      } catch (error) {
        log(`FAILED: ${error.message}`);
        window.__sandboxError = String(error);
        throw error;
      }

      board.on('ready', () => {
        log('ready');
        window.__sandboxReady = true;
      });
      board.on('move', ({ from, to }) => {
        const move = game.move({ from, to, promotion: 'q' });
        board.clearSelection();
        if (!move) return log(`illegal ${from}${to}`);
        board.setPosition(game.position());
        board.setHighlights({ lastMove: { from, to }, check: check() });
        log(`${move.san}   ${game.fen}`);
      });
      board.on('select', (square) => {
        if (!square) return board.setHighlights({ ...lastHighlights });
        board.setHighlights({
          ...lastHighlights,
          selected: square,
          legal: game.legalMoves(square).map((m) => ({ to: m.to, capture: Boolean(m.captured) })),
        });
      });
      board.on('arrow', ({ from, to }) => board.setArrows([{ from, to }]));

      let lastHighlights = {};
      const check = () => {
        if (!game.isCheck) return null;
        const king = Object.entries(game.position()).find(([, code]) => code === `${game.turn}K`);
        return king?.[0] ?? null;
      };

      board.setPosition(game.position(), { animate: false });

      fill(
        'theme',
        Object.values(THEMES).map((t) => [t.id, t.name]),
      ).addEventListener('change', (e) => board.setTheme(e.target.value));
      fill(
        'pieceSet',
        Object.values(PIECE_SETS).map((s) => [s.id, s.name]),
      ).addEventListener('change', (e) => board.setPieceSet(e.target.value));
      fill(
        'camera',
        Object.values(CAMERA_MODES).map((c) => [c.id, c.name]),
      ).addEventListener('change', (e) => board.setCameraMode(e.target.value));

      document.getElementById('flip').addEventListener('click', () => board.orientation('flip'));
      document.getElementById('arrow').addEventListener('click', () => {
        board.setArrows(
          board.highlights.arrowMeshes.length
            ? []
            : [
                { from: 'e2', to: 'e4' },
                { from: 'g1', to: 'f3', color: 0x35d29a },
              ],
        );
      });
      document.getElementById('play').addEventListener('click', async () => {
        for (const san of ['e4', 'c5', 'Nf3', 'd6', 'd4', 'cxd4', 'Nxd4', 'Nf6', 'Nc3', 'a6']) {
          const move = game.move(san);
          if (!move) break;
          lastHighlights = { lastMove: { from: move.from, to: move.to } };
          board.setHighlights(lastHighlights);
          await board.setPosition(game.position());
          log(`${move.san}   ${game.fen}`);
        }
      });

      window.__sandboxApi = { board, game };
    </script>
  </body>
</html>
